services:
  - type: web
    name: mindmoney-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Todas as chaves abaixo ficam sem valor de propósito (sync: false) --
      # precisam ser preenchidas manualmente no dashboard do Render, com os
      # dados reais do Aiven e um JWT_SECRET gerado na hora. Nunca commitar
      # segredo de verdade neste arquivo.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGIN
        sync: false

name: Keep alive

# Visita o /health de produção periodicamente. Isso mantém o banco do Aiven
# (plano gratuito) com uso regular, para ele não ser desligado por
# inatividade, e evita a espera de ~1 min do Render "acordando".
# /health faz um SELECT 1 no banco, então cada visita conta como uso real.
# O GitHub pode atrasar execuções agendadas em alguns minutos; tudo bem.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        # Até 3 tentativas: a primeira pode pegar o Render ainda ligando.
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://mindmoney-backend.onrender.com/health; then
              exit 0
            fi
            echo "tentativa $i falhou, tentando de novo em 20s"
            sleep 20
          done
          echo "::error::/health não respondeu — o banco no Aiven pode estar desligado"
          exit 1
